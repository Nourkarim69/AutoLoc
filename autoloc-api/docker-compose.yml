# Monitoring of AutoLoc: Prometheus collects the metrics of the Spring Boot app, Grafana displays them.
# Start the Spring Boot app first (IntelliJ), then: docker compose up -d
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: autoloc-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux, harmless on Windows / macOS

  grafana:
    image: grafana/grafana:latest
    container_name: autoloc-grafana
    ports:
      - "3000:3000"
    volumes:
      # data source (Prometheus) and the "AutoLoc — Application Monitoring" dashboard, loaded at startup
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
