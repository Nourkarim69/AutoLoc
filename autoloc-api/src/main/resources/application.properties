spring.application.name=autoloc-api

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc=INFO

# Port 8080 is already used by another program on this computer
server.port=8081

# Security: session cookie not readable by JavaScript and never sent by other sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=60m
# Never show Java stack traces in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# Admin account created at first start (dev profile). Change it with the ADMIN_EMAIL / ADMIN_PASSWORD variables.
autoloc.admin.email=${ADMIN_EMAIL:admin@autoloc.fr}
autoloc.admin.password=${ADMIN_PASSWORD:Admin2026!}

# Active profile (dev = demo data + more logs)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
