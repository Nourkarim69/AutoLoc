spring.application.name=autoloc-api

# Database connection (credentials from environment variables, never in plain text)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
# SQL logs are enabled only in the dev profile (application-dev.properties): printing every query is slow
spring.jpa.show-sql=false
# Close the DB connection as soon as the service method ends (data needed by the JSON is loaded with @EntityGraph)
spring.jpa.open-in-view=false
# Loads lazy/eager collections of up to 50 entities in one query (avoids N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Logs
logging.level.fr.ece.autoloc=INFO

# Port 8080 is already used by another program on this computer
server.port=8081

# Performance: gzip compression of JSON / HTML / CSS / JS responses
server.compression.enabled=true
server.compression.min-response-size=1024

# Security: session cookie not readable by JavaScript and never sent by other sites
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=60m
# Never show Java stack traces in error responses
server.error.include-stacktrace=never
server.error.include-message=never

# Admin account created at first start (dev profile). Change it with the ADMIN_EMAIL / ADMIN_PASSWORD variables.
autoloc.admin.email=${ADMIN_EMAIL:admin@autoloc.fr}
autoloc.admin.password=${ADMIN_PASSWORD:Admin2026!}

# Spring Security demo accounts (HTTP Basic, in memory, classroom only): student / admin
autoloc.demo.user.password=${DEMO_USER_PASSWORD:student123}
autoloc.demo.admin.password=${DEMO_ADMIN_PASSWORD:admin123}

# Monitoring: Actuator health + metrics in Prometheus format (scraped by Prometheus, shown in Grafana)
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
# histogram buckets so that Grafana can compute the 95th percentile of the response time
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=${spring.application.name}

# Active profile: dev (demo data + SQL logs) by default, prod for a real deployment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
