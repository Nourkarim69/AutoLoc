# "prod" profile: start with SPRING_PROFILES_ACTIVE=prod
# - the schema is only checked, never modified (create it with a migration tool or from the dev schema)
# - no demo data (DemoDataLoader is @Profile("dev")), no SQL logs
# - session cookie only sent over HTTPS
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoloc_db}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.fr.ece.autoloc=INFO

server.servlet.session.cookie.secure=true

# HTTPS: provide a PKCS12 keystore, e.g.
#   keytool -genkeypair -alias autoloc -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore autoloc.p12 -validity 365
# then set SSL_ENABLED=true, SSL_KEYSTORE=file:/path/autoloc.p12 and SSL_KEYSTORE_PASSWORD=...
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=autoloc
