# "dev" profile: enable with spring.profiles.active=dev (already the default in application.properties)
# Inserts demo data at startup via DemoDataLoader and shows the SQL generated by Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc=DEBUG
